# Build spec for the preprocess-hic Nextflow pipeline (Hi-C FASTQ -> BAM, pairs, mcool).
# Releases ship the exact env they were tested in as
#   envs/preprocess-hic-<version>.linux-64.explicit.txt
# Install from that file, not from this one (see RELEASING.md).
#
# Aligner, pairtools, samtools, seqkit and Nextflow are the versions of microc-preprocess 1.1.2.
# cooler builds the .mcool; pairix indexes the .pairs.gz; pytest runs tests/preprocess-hic.
name: preprocess-hic
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pairtools=1.1.3
  - bwa=0.7.18
  - bwa-mem2=2.2.1
  - samtools=1.21
  - seqkit=2.14.0
  - cooler=0.12.1
  - pairix=0.3.9
  - nextflow=24.10.6
  - openjdk=17
  - pytest
