name: hicpro-native
# Native (non-Docker) runtime for preprocess_hic.wdl on clusters without Docker.
# Versions are resolved at build time; the exact solved env is committed as
# envs/hicpro-native.linux-64.explicit.txt (see RELEASING.md conventions).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - hicpro >=3.1
  - bowtie2
  - samtools
  - cooler
  - openjdk =17
  - pigz
  - wget
