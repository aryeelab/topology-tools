# Helpers for running preprocess_hic.wdl natively: Java for Cromwell/juicer_tools,
# pigz for FASTQ chunking, pairix + htslib (bgzip) for cooler csort.
# cooler itself comes from the HiC-Pro env (0.8.11, as in the original Docker image).
name: hic-utils
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - openjdk=17
  - pigz
  - pairix
  - htslib
