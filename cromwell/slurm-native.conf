# Cromwell backend for running topology-tools WDLs natively (no Docker) on a SLURM cluster.
# Tools come from PATH: the environment of the Cromwell process is exported to every job
# (sbatch default --export=ALL), so put the HiC-Pro and helper env bin dirs on PATH before
# starting Cromwell. Any `docker` runtime attribute is ignored (submit-docker == submit).
#
# Usage:
#   export PATH=<hicpro env>/bin:<hic-utils env>/bin:$PATH
#   java -Dconfig.file=cromwell/slurm-native.conf \
#        -Dbackend.providers.SLURM.config.root=<run dir>/cromwell-executions \
#        -jar cromwell.jar run preprocess_hic.wdl -i inputs.json -o options.json
# Optional overrides (-D...): slurm_account, slurm_partition, concurrent-job-limit.
include required(classpath("application"))

system { job-rate-control { jobs = 5, per = 1 second } }

# File-based database so a rerun of the same workflow can reuse finished calls.
database {
  profile = "slick.jdbc.HsqldbProfile$"
  db {
    driver = "org.hsqldb.jdbcDriver"
    url = "jdbc:hsqldb:file:cromwell-db/cromwell-db;shutdown=false;hsqldb.default_table_type=cached;hsqldb.tx=mvcc;hsqldb.result_max_memory_rows=10000;hsqldb.large_data=true;hsqldb.applog=1;hsqldb.lob_compressed=true;hsqldb.script_format=3"
    connectionTimeout = 120000
    numThreads = 1
  }
}

call-caching { enabled = true, invalidate-bad-cache-results = true }

backend {
  default = SLURM
  providers {
    SLURM {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        root = "cromwell-executions"
        concurrent-job-limit = 60
        exit-code-timeout-seconds = 300
        runtime-attributes = """
        Int cpu = 1
        Int? memory_mb
        String slurm_partition = "defq"
        String slurm_account = "aryeelab"
        String? docker
        """
        submit = """
        sbatch --parsable -J ${job_name} -D ${cwd} -o ${out} -e ${err} \
          -p ${slurm_partition} -A ${slurm_account} -c ${cpu} ${"--mem=" + memory_mb} \
          --wrap "/bin/bash ${script}"
        """
        submit-docker = """
        sbatch --parsable -J ${job_name} -D ${cwd} -o ${out} -e ${err} \
          -p ${slurm_partition} -A ${slurm_account} -c ${cpu} ${"--mem=" + memory_mb} \
          --wrap "/bin/bash ${script}"
        """
        kill = "scancel ${job_id}"
        kill-docker = "scancel ${job_id}"
        check-alive = "squeue -h -j ${job_id}"
        job-id-regex = "(\\d+).*"
        filesystems {
          local {
            localization = ["soft-link", "hard-link", "copy"]
            caching {
              duplication-strategy = ["soft-link", "hard-link", "copy"]
              hashing-strategy = "path+modtime"
              check-sibling-md5 = false
            }
          }
        }
      }
    }
  }
}
